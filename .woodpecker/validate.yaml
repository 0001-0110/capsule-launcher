when:
  - event: push

steps:

  - name: code-analysis
    image: ubuntu:26.10
    depends_on: []
    commands:
      - apt update && apt install luarocks -y
      - luarocks install luacheck
      - luacheck ./

  - name: style
    image: rust:1.98.0-slim
    depends_on: []
    commands:
      - cargo install stylua
      - stylua --check ./

  - name: validate mod structure
    image: python:3.10.21-alpine3.24
    depends_on: []
    commands:
      - apk add jq
      - ./ci/validate_mod_structure.sh ${CI_COMMIT_TAG:-}
