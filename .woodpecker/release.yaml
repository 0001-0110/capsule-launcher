when:
  - event: tag
    branch: main

depends_on:
  - validate

steps:

  - name: validate-version
    image: alpine
    commands:
      - apk add jq
      - '[ $CI_COMMIT_TAG = $(jq .version info.json) ] || exit 1'
      - '[ $CI_COMMIT_TAG = $(grep -E "Version: .*" changelog.txt | head -n 1 | cut -d " " -f 2 ] || exit 2'

  - name: package
    image: gcc:16.2.0
    commands:
      - make archive

  - name: upload
    image: python:3.10.21-alpine3.24
    environment:
      MOD_PORTAL_API_KEY:
        from_secret: mod_portal_api_key
    commands:
      - pip install requests
      - python .github/upload.py
